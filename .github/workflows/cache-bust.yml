name: Cache busting

# Stämplar om ?v=-hasharna i index.html vid varje push till main, så att
# ingen får en gammal css/js ur webbläsarcachen efter en ny version.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cache-bust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset hashes
        run: node tools/cache-bust.js

      # Pushar med GITHUB_TOKEN, vilket inte triggar nya workflows —
      # så det här kan inte loopa.
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "index.html är redan aktuell — inget att göra."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Uppdatera cache-busting-hashar"
          git push
